services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            # Publicado apenas em loopback por padrao. Esta maquina tem IP
            # publico e o Docker contorna o INPUT do UFW ao publicar portas,
            # entao expor em 0.0.0.0 deixaria a aplicacao (com APP_DEBUG=true)
            # aberta na internet. Para acessar de fora, use um tunel SSH:
            #   ssh -L 8080:127.0.0.1:8080 <host>
            # Para publicar de verdade, defina APP_BIND=0.0.0.0 no .env.
            - '${APP_BIND:-127.0.0.1}:${APP_PORT:-80}:80'
            - '${APP_BIND:-127.0.0.1}:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            # Usuario que executa o PHP dentro do container. O padrao do Sail
            # ('sail') vale para qualquer maquina. Onde a sessao do host for
            # root, defina SUPERVISOR_PHP_USER=root no .env local: isso alinha
            # o dono dos arquivos entre host e container e evita o descompasso
            # de uid que quebra o Git com "dubious ownership".
            SUPERVISOR_PHP_USER: '${SUPERVISOR_PHP_USER:-sail}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
    mysql:
        image: 'mysql:8.4'
        ports:
            # Publicado apenas em loopback. O Docker insere suas regras antes do
            # INPUT do UFW, entao uma porta publicada em 0.0.0.0 fica acessivel
            # pela internet mesmo com o firewall fechado. A aplicacao alcanca o
            # banco pela rede interna 'sail', nao por esta porta.
            - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
